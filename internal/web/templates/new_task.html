{{ define "title" }}New Task — synapse{{ end }}

{{ define "content" }}
<div class="page-header">
  <h1>New Task</h1>
</div>

<div class="new-task-form-card">
  {{ if .Error }}
  <p class="form-error">{{ .Error }}</p>
  {{ end }}

  <form method="post" action="/tasks/new">
    <label for="pipeline">Pipeline</label>
    <select id="pipeline" name="pipeline" required>
      {{ range .Pipelines }}
      <option value="{{ .Name }}">{{ .Name }} ({{ len .Stages }} stages)</option>
      {{ end }}
    </select>

    <label for="task_number">Task Number</label>
    <input
      type="text"
      id="task_number"
      name="task_number"
      required
      placeholder="e.g. JIRA-123"
    />

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="6" required placeholder="Describe the task to be executed by the pipeline agents..."></textarea>

    <label for="working_dir">Working directory</label>
    <input type="text" id="working_dir" name="working_dir" value="{{ .WorkingDir }}" required>

    <details class="advanced-section">
      <summary class="advanced-section-toggle">Настройки песочницы</summary>
      <div class="advanced-section-content">
        <label for="network_policy">Сетевая политика</label>
        <select id="network_policy" name="network_policy">
          <option value="restricted">ограниченный</option>
          <option value="full">полный</option>
          <option value="none">отключен</option>
        </select>

        <label for="cpu_limit">Лимит CPU</label>
        <input type="number" id="cpu_limit" name="cpu_limit" step="0.5" min="0.5" max="16" placeholder="2.0">

        <label for="memory_limit_mb">Лимит памяти (МБ)</label>
        <input type="number" id="memory_limit_mb" name="memory_limit_mb" step="256" min="256" max="16384" placeholder="2048">
      </div>
    </details>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create &amp; Run</button>
      <a href="/" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{{ end }}
